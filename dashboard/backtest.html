<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backtest — Signal OS</title><link rel="stylesheet" href="style.css"></head><body data-mode="backtest"><main style="margin:0;max-width:1100px;padding-top:45px"><header><div><p class="eyebrow">HISTORICAL TESTING</p><h1>Run strategy backtest</h1></div><a class="quiet" href="/">← Dashboard</a></header><section class="panel"><p class="subtle">Backtests use historical candles and can make LLM calls. Set token and cost limits before launching.</p><form><div class="form-grid"><label>Symbols <select id="symbolChoices" multiple size="6"><option value="BTCUSDT" selected>BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="BNBUSDT">BNB / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="XRPUSDT">XRP / USDT</option><option value="DOGEUSDT">DOGE / USDT</option><option value="PEPEUSDT">PEPE / USDT</option><option value="ZECUSDT">ZEC / USDT</option><option value="ETHFIUSDT">ETHFI / USDT</option><option value="FUNUSDT">FUN / USDT</option><option value="ASTRUSDT">ASTR / USDT</option></select></label><label>Timeframe <select data-option="interval"><option>1m</option><option>5m</option><option>15m</option><option>30m</option><option selected>1h</option><option>2h</option><option>4h</option><option>6h</option><option>12h</option><option>1d</option></select></label><label>Lookback candles <input data-option="lookback" type="number" min="100" value="400"></label><label>Step <input data-option="step" type="number" min="1" value="10"></label><label>LLM input candles (n) <input data-option="n" type="number" min="1" value="40"></label><label>Max expected time <input data-option="max_expected_time" type="number" min="1" value="12"></label><label>Token limit <input data-option="token_limit" type="number" min="0" value="15000000"></label><label>Input token price <input data-option="input_token_price" type="number" min="0" step=".000001" value="0"></label><label>Output token price <input data-option="output_token_price" type="number" min="0" step=".000001" value="0"></label><label>Maximum cost (USD) <input data-option="max_cost" type="number" min="0" step=".01" value="1"></label><label>Output directory <input data-option="output_dir" value="backtest_results"></label><label>Higher timeframes <input data-option="higher_timeframes" value="4h"></label><label>Indicators <input data-option="indicators" value="EMA20, EMA50, EMA100, EMA200, sma20, sma50, rsi, macd_line, macd_signal, macd_hist, stoch_k, stoch_d, atr, bb_upper, bb_middle, bb_lower, vwap"></label></div><h3 style="margin-top:32px">Quant and web context</h3><div class="form-grid"><label>Quant input data <select data-option="quant_input_data"><option>both</option><option>ohlcv</option><option>indicators</option></select></label><label>Quant model <select data-option="quant_model"><option>random_forest</option><option>extra_trees</option><option>gradient_boosting</option><option>hist_gradient_boosting</option><option>k_neighbors</option><option>ridge</option><option>svr</option><option>sgd</option><option>passive_aggressive</option></select></label><label>Quant transform <select data-option="quant_transform"><option>none</option><option>bins</option><option>average</option><option>log</option></select></label><label>Quant target <input data-option="quant_output_target" value="close"></label><label>Quant shift <input data-option="quant_shift" type="number" min="1" value="1"></label><label>Prediction rows <input data-option="quant_predict_rows" type="number" min="1" value="1"></label><label>Web aspects <input data-option="web_search_aspects" value="policy, news, macro, exchange"></label><label>Web extra terms <input data-option="web_search_extra_terms" placeholder="regulation, ETF"></label><label>Web topics <input data-option="web_search_topics" placeholder="policy, news"></label><label>Web max results <input data-option="web_search_max_results" type="number" min="1" value="5"></label></div><div class="toggles"><label class="toggle"><input data-option="quant_enabled" type="checkbox"><span></span> Enable quant model</label><label class="toggle"><input data-option="web_search_enabled" type="checkbox"><span></span> Enable web context</label></div><div class="run-action"><span id="formMessage"></span><button class="primary">Launch backtest <span>→</span></button></div></form></section></main><script src="run-page.js"></script></body></html>

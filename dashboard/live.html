<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Analysis — Signal OS</title><link rel="stylesheet" href="style.css"></head><body data-mode="live"><main style="margin:0;max-width:1100px;padding-top:45px"><header><div><p class="eyebrow">LIVE EXECUTION</p><h1>Run live market analysis</h1></div><a class="quiet" href="/">← Dashboard</a></header><section class="panel"><p class="subtle">Use Dry run for safe testing. Turn it off only when you want eligible signals delivered to Telegram.</p><form><div class="form-grid"><label>Symbols <select id="symbolChoices" multiple size="6"><option value="BTCUSDT" selected>BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="BNBUSDT">BNB / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="XRPUSDT">XRP / USDT</option><option value="DOGEUSDT">DOGE / USDT</option><option value="PEPEUSDT">PEPE / USDT</option><option value="ZECUSDT">ZEC / USDT</option><option value="ETHFIUSDT">ETHFI / USDT</option><option value="FUNUSDT">FUN / USDT</option><option value="ASTRUSDT">ASTR / USDT</option></select></label><label>Timeframe <select data-option="interval"><option>1m</option><option>5m</option><option>15m</option><option>30m</option><option selected>1h</option><option>2h</option><option>4h</option><option>6h</option><option>12h</option><option>1d</option></select></label><label>Model name <input data-option="model_name" placeholder="Default from .env"></label><label>Candle limit <input data-option="limit" type="number" min="1" value="400"></label><label>Iterations <input data-option="iterations" type="number" min="1" value="2"></label><label>Confidence threshold <input data-option="confidence" type="number" min="0" max="1" step=".01" value=".70"></label><label>Gain ratio threshold <input data-option="gain_ratio" type="number" min="0" step=".1" value="1"></label><label>Higher timeframes <input data-option="higher_timeframes" value="4h" placeholder="4h, 1d"></label><label>Indicators <input data-option="indicators" value="EMA20, EMA50, EMA100, EMA200, sma20, sma50, rsi, macd_line, macd_signal, macd_hist, stoch_k, stoch_d, atr, bb_upper, bb_middle, bb_lower, vwap"></label></div><h3 style="margin-top:32px">Quant controls</h3><div class="form-grid"><label>Quant candle limit <input data-option="quant_limit" type="number" min="1" value="400"></label><label>Input data <select data-option="quant_input_data"><option>both</option><option>ohlcv</option><option>indicators</option></select></label><label>Input set <select data-option="quant_input_set"><option>both</option><option>ohlcv</option><option>indicators</option></select></label><label>Test size <input data-option="quant_test_size" type="number" min=".01" max=".99" step=".01" value=".20"></label><label>Model <select data-option="quant_model"><option>random_forest</option><option>extra_trees</option><option>gradient_boosting</option><option>hist_gradient_boosting</option><option>k_neighbors</option><option>ridge</option><option>svr</option><option>sgd</option><option>passive_aggressive</option></select></label><label>Transform <select data-option="quant_transform"><option>none</option><option>bins</option><option>average</option><option>log</option></select></label><label>Output target <input data-option="quant_output_target" value="close"></label><label>Shift <input data-option="quant_shift" type="number" min="1" value="1"></label><label>Prediction rows <input data-option="quant_predict_rows" type="number" min="1" value="1"></label><label>Quant indicators <input data-option="quant_indicators" placeholder="rsi, atr, EMA20"></label></div><h3 style="margin-top:32px">Web context</h3><div class="form-grid"><label>Aspects <input data-option="web_search_aspects" value="policy, news, macro, exchange"></label><label>Extra terms <input data-option="web_search_extra_terms" placeholder="regulation, ETF"></label><label>Topics <input data-option="web_search_topics" placeholder="policy, news"></label><label>Max results <input data-option="web_search_max_results" type="number" min="1" value="5"></label></div><div class="toggles"><label class="toggle"><input data-option="dry_run" type="checkbox" checked><span></span> Dry run</label><label class="toggle"><input data-option="quant_enabled" type="checkbox"><span></span> Enable quant model</label><label class="toggle"><input data-option="web_search_enabled" type="checkbox"><span></span> Enable web context</label></div><div class="run-action"><span id="formMessage"></span><button class="primary">Launch live analysis <span>→</span></button></div></form></section></main><script src="run-page.js"></script></body></html>
